services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: app
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shortener"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./services/app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://app:localdev@postgres:5432/shortener
      REDIS_URL: redis://redis:6379
      BASE_URL: http://localhost:8080
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  dashboard:
    build: ./services/dashboard
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://app:localdev@postgres:5432/shortener?sslmode=disable
      PORT: "8081"
      CORS_ALLOW_ORIGIN: "http://localhost:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
